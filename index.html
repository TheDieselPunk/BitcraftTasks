<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Traveler Tasks — BitCraft</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #07070f;
      color: #c8c8dc;
      min-height: 100vh;
      padding: 0 0 64px;
    }

    /* ── Top bar ── */
    #topbar {
      background: #0d0d1e;
      border-bottom: 2px solid #2a2a5a;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    #logo {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: .1em;
      color: #f0a500;
      text-transform: uppercase;
      white-space: nowrap;
    }
    #logo span { color: #444466; font-weight: 400; font-size: .75rem; letter-spacing: .04em; }
    #logo-desc { color: #333355; font-size: .7rem; font-weight: 400; letter-spacing: .02em; text-transform: none; margin-top: 2px; }
    #app-version { margin-left: auto; color: #333355; font-size: .68rem; letter-spacing: .06em; white-space: nowrap; align-self: flex-start; padding-top: 2px; }

    #search-row { display: flex; gap: 8px; flex: 1; max-width: 360px; }
    #search-row input {
      flex: 1; padding: 7px 12px; border-radius: 5px;
      border: 1px solid #2a2a5a; background: #09091a;
      color: #c8c8dc; font-size: .85rem;
    }
    #search-row input:focus { outline: none; border-color: #f0a500; }
    #search-row button {
      padding: 7px 18px; border: none; border-radius: 5px;
      background: #f0a500; color: #07070f;
      font-weight: 800; font-size: .78rem;
      cursor: pointer; letter-spacing: .06em; text-transform: uppercase;
    }
    #search-row button:hover { background: #ffc030; }
    #search-row button:disabled { opacity: .4; cursor: default; }

    /* ── Player strip ── */
    #player-strip {
      display: none;
      background: #0a0a18;
      border-bottom: 1px solid #1a1a3a;
      padding: 8px 20px;
      gap: 20px;
      align-items: center;
      flex-wrap: wrap;
      font-size: .8rem;
    }
    #player-strip.visible { display: flex; }
    #ps-name   { font-weight: 800; color: #f0a500; letter-spacing: .08em; text-transform: uppercase; }
    #ps-detail { color: #666688; }
    #ps-market { display: flex; align-items: center; gap: 6px; color: #b47cff; font-size: .75rem; }
    #claim-input { background: #0f0f28; color: #b47cff; border: 1px solid #2a2a5a; border-radius: 4px; padding: 2px 6px; font-size: .75rem; width: 180px; }
    #reset-cd  { font-size: .8rem; font-weight: 700; color: #5bc8e8; }

    #range-group {
      display: flex; align-items: center; gap: 8px;
      font-size: .75rem; color: #666688; margin-left: auto;
    }
    #range-group input[type=range] { width: 110px; accent-color: #f0a500; }
    #range-val { color: #f0a500; font-weight: 700; min-width: 36px; }

    /* ── Housing row ── */
    #housing-row {
      display: none;
      background: #090916;
      border-bottom: 1px solid #1a1a3a;
      padding: 7px 20px;
      gap: 8px; align-items: center; flex-wrap: wrap;
      font-size: .75rem;
    }
    #housing-row.visible { display: flex; }
    #housing-label { color: #444466; white-space: nowrap; }
    #housing-input {
      padding: 5px 10px; border-radius: 4px;
      border: 1px solid #2a2a5a; background: #09091a;
      color: #c8c8dc; font-size: .8rem; width: 180px;
    }
    #housing-input:focus { outline: none; border-color: #5bc8e8; }
    #btn-housing-add {
      padding: 5px 12px; border: 1px solid #1a3a4a; border-radius: 4px;
      background: #091420; color: #5bc8e8;
      font-size: .72rem; font-weight: 700; cursor: pointer;
      letter-spacing: .05em; text-transform: uppercase;
    }
    #btn-housing-add:hover { background: #0f2030; border-color: #5bc8e8; }
    #housing-chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .housing-chip {
      display: flex; align-items: center; gap: 5px;
      background: #091a20; border: 1px solid #1a4050;
      border-radius: 12px; padding: 2px 10px 2px 10px;
      color: #5bc8e8; font-size: .7rem; cursor: default;
    }
    .housing-chip button {
      background: none; border: none; color: #2a6a7a;
      font-size: .8rem; cursor: pointer; padding: 0; line-height: 1;
    }
    .housing-chip button:hover { color: #e05050; }
    .housing-name { color: #5bc8e8; font-size: .7rem; }

    /* ── Toolbar ── */
    #toolbar {
      display: none; padding: 8px 20px;
      gap: 8px; align-items: center; flex-wrap: wrap;
      border-bottom: 1px solid #1a1a3a;
    }
    #toolbar.visible { display: flex; }
    #toolbar button {
      padding: 4px 12px;
      border: 1px solid #2a2a5a;
      border-radius: 4px; cursor: pointer;
      font-size: .7rem; font-weight: 700;
      letter-spacing: .05em; text-transform: uppercase;
      background: #0d0d1e; color: #666688;
    }
    #toolbar button:hover { border-color: #f0a500; color: #f0a500; }
    #btn-filter.active { background: #0a1f0a; border-color: #52c46a; color: #52c46a; }
    #status     { font-size: .7rem; color: #444466; }
    #live-status {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 3px 10px 3px 8px; border: 1px solid #2a2a5a; border-radius: 999px;
      font-size: .65rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
      color: #666688; cursor: default;
    }
    #live-status:empty { display: none; }
    .live-dot {
      width: 9px; height: 9px; border-radius: 50%; flex: none;
      background: #555570;
    }
    #live-status.live-live       { color: #52c46a; border-color: #1f4a28; }
    #live-status.live-live .live-dot {
      background: radial-gradient(circle at 35% 35%, #b8ffc6, #3ddc5f 55%, #1f8a35);
      box-shadow: 0 0 6px 1px #3ddc5f99;
      animation: live-pulse 2s ease-in-out infinite;
    }
    #live-status.live-connecting,
    #live-status.live-retrying   { color: #d6a23a; border-color: #4a3a1a; }
    #live-status.live-connecting .live-dot,
    #live-status.live-retrying .live-dot {
      background: radial-gradient(circle at 35% 35%, #ffe7a8, #f0a500 60%, #9a6a00);
      animation: live-blink 1s ease-in-out infinite;
    }
    #live-status.live-off        { color: #a05050; border-color: #4a1f1f; }
    #live-status.live-off .live-dot {
      background: radial-gradient(circle at 35% 35%, #ffb0b0, #d04848 60%, #7a2020);
    }
    @keyframes live-pulse { 0%, 100% { box-shadow: 0 0 4px 0 #3ddc5f88; } 50% { box-shadow: 0 0 9px 3px #3ddc5fcc; } }
    @keyframes live-blink { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    #api-warnings { padding: 4px 20px; font-size: .75rem; color: #c8902a; display: none; }
    #api-warnings .warn-item::before { content: '⚠ '; }

    /* ── Table ── */
    #tbl-wrap { overflow-x: auto; padding: 0; }
    #credits-section, #exp-section { padding: 8px 20px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    #credits-section:empty { display: none; }
    .credit-max  { color: #444466; font-weight: 400; }
    .credit-low  { color: #e05050; font-weight: 700; }
    #quests-section { padding: 4px 20px 8px; font-size: .75rem; }
    #quests-section:empty { display: none; }
    #quests-section .exp-label { display: block; margin-bottom: 4px; }
    #recommend-section { padding: 4px 20px 8px; font-size: .75rem; }
    #recommend-section:empty { display: none; }
    #recommend-section .exp-label { display: block; margin-bottom: 4px; }
    #stock-section { padding: 4px 20px 8px; font-size: .75rem; }
    #stock-section:empty { display: none; }
    #stock-section .exp-label { display: block; margin-bottom: 4px; }
    .stock-grid   { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; }
    .stock-card   { background: #0b0b1a; border: 1px solid #1a1a3a; border-radius: 6px; padding: 6px 10px 8px; min-width: 0; }
    .stock-head   { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; margin-bottom: 2px; }
    .stock-forced { color: #52c46a; font-size: .62rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
                    border: 1px solid #1f4a2a; border-radius: 3px; padding: 0 4px; cursor: default; }
    .stock-cover  { color: #666688; font-size: .7rem; margin-bottom: 4px; }
    .stock-cover span { font-size: .7rem; }
    .stock-row    { display: grid; grid-template-columns: minmax(0, 1fr) 90px auto; gap: 8px; align-items: center; padding: 2px 0; cursor: default; }
    .stock-name   { color: #c8c8dc; font-size: .7rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stock-bar    { height: 7px; background: #15152e; border-radius: 4px; overflow: hidden; }
    .stock-fill   { display: block; height: 100%; border-radius: 4px; }
    .stock-ok     { background: #52c46a; }
    .stock-part   { background: #f0a500; }
    .stock-none   { background: transparent; }
    .stock-num    { font-size: .7rem; font-weight: 700; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; min-width: 72px; }
    .stock-ok-t   { color: #52c46a; }
    .stock-part-t { color: #f0a500; }
    .stock-none-t { color: #e05050; }
    .rec-row    { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; padding: 3px 0; border-bottom: 1px solid #111128; }
    .rec-label  { min-width: 92px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: #666688; }
    .rec-best .rec-label { color: #52c46a; }
    .rec-claim  { color: #b47cff; font-weight: 800; }
    .rec-best .rec-claim { color: #f0a500; }
    .rec-cover  { color: #52c46a; font-weight: 800; cursor: default; }
    .rec-use    { background: none; border: 1px solid #2a2a5a; border-radius: 4px; color: #666688; font-size: .62rem;
                  font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 1px 6px; cursor: pointer; }
    .rec-use:hover { border-color: #f0a500; color: #f0a500; }
    .quest-row    { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; padding: 3px 0; border-bottom: 1px solid #111128; }
    .quest-status { min-width: 92px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
    .quest-trav   { color: #f0a500; font-weight: 800; min-width: 70px; }
    .quest-unlock { color: #b47cff; }
    .quest-req    { color: #e05050; font-size: .7rem; }
    .quest-after  { color: #6ab0ff; font-size: .7rem; }
    .quest-needs  { color: #c8c8dc; font-size: .7rem; flex-basis: 100%; padding-left: 102px; }
    .quest-cost   { color: #f0a500; font-weight: 800; }
    .quest-price  { color: #f0a500; font-weight: 700; cursor: default; }
    .quest-short  { color: #e05050; font-size: .7rem; }
    .quest-have   { cursor: default; border-bottom: 1px dotted #444466; }
    .quest-craft  { color: #c8c8dc; font-size: .7rem; flex-basis: 100%; padding-left: 114px; }
    .quest-route  { padding: 2px 0 6px; border-bottom: 1px solid #111128; }
    .route-head   { color: #c8c8dc; font-weight: 700; cursor: default; }
    .route-row    { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; padding: 3px 0; }
    .route-label  { min-width: 92px; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: #52c46a; }
    .route-stop   { color: #c8c8dc; cursor: default; border-bottom: 1px dotted #444466; }
    .pickup-place { color: #52c46a; font-weight: 700; }
    .stand-mark   { color: #e05050; font-weight: 800; }
    .stock-short  { color: #d6a23a; font-size: .85em; }
    .stand-live   { color: #3ddc5f; font-size: .7em; margin-left: 3px; text-shadow: 0 0 4px #3ddc5f99; cursor: default; }
    .quest-in_progress .quest-status { color: #f0a500; }
    .quest-ready .quest-status       { color: #52c46a; }
    .quest-locked                    { opacity: .55; }
    .quest-next .quest-status        { color: #6ab0ff; }
    .quest-locked .quest-status      { color: #666688; }
    /* ── Tabs ── */
    #tabs { display: none; gap: 2px; padding: 10px 20px 0; border-bottom: 1px solid #2a2a5a; }
    #tabs.visible { display: flex; }
    .tab-btn {
      padding: 7px 18px; border: 1px solid #1a1a3a; border-bottom: none; border-radius: 6px 6px 0 0;
      background: #0b0b1a; color: #666688; cursor: pointer; margin-bottom: -1px;
      font-size: .75rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
    }
    .tab-btn:hover { color: #c8c8dc; }
    .tab-btn.active { background: #07070f; color: #f0a500; border-color: #2a2a5a; border-bottom: 1px solid #07070f; }
    .tab-count { color: #444466; font-weight: 700; margin-left: 4px; }
    .tab-btn.active .tab-count { color: #b47cff; }
    .tab-pane[hidden] { display: none; }
    body.tab-quests .tasks-only { display: none !important; }

    /* ── Active quests ── */
    #active-quests-section { padding: 8px 20px; font-size: .75rem; }
    #active-quests-section:empty { display: none; }
    #active-quests-section .exp-label { display: block; margin-bottom: 4px; }
    .aq-summary   { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
    .aq-filter    { background: #0f0f28; border: 1px solid #2a2a5a; border-radius: 12px; padding: 3px 10px; font-size: .72rem;
                    color: #c8c8dc; cursor: pointer; display: inline-flex; gap: 6px; }
    .aq-filter.active { border-color: #f0a500; color: #f0a500; }
    .aq-filter b  { font-weight: 800; }
    .aq-list      { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 8px; }
    .aq-card      { background: #0b0b1a; border: 1px solid #1a1a3a; border-left: 3px solid #2a2a5a; border-radius: 6px; padding: 7px 10px 8px; min-width: 0; }
    .aq-card.aq-ready   { border-left-color: #52c46a; }
    .aq-card.aq-housing { border-left-color: #5bc8e8; }
    .aq-card.aq-buy     { border-left-color: #f0a500; }
    .aq-card.aq-barter  { border-left-color: #b47cff; }
    .aq-card.aq-short   { border-left-color: #e05050; }
    .aq-card.aq-game    { border-left-color: #444466; }
    .aq-card.aq-stale   { border-left-color: #3ddc5f; opacity: .7; }
    .aq-stale .aq-verdict   { color: #3ddc5f; }
    .aq-head      { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; }
    .aq-name      { color: #f0a500; font-weight: 800; font-size: .8rem; }
    .aq-track     { color: #f0a500; font-size: .7rem; cursor: default; }
    .aq-stagen    { color: #444466; font-size: .65rem; margin-left: auto; white-space: nowrap; }
    .aq-stage     { color: #8888aa; font-size: .7rem; margin: 1px 0 5px; }
    .aq-verdict   { font-size: .65rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
    .aq-ready .aq-verdict   { color: #52c46a; }
    .aq-housing .aq-verdict { color: #5bc8e8; }
    .aq-buy .aq-verdict     { color: #f0a500; }
    .aq-barter .aq-verdict  { color: #b47cff; }
    .aq-short .aq-verdict   { color: #e05050; }
    .aq-game .aq-verdict    { color: #666688; }
    .aq-need      { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; padding: 2px 0; border-top: 1px solid #111128; }
    .aq-item      { color: #c8c8dc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .aq-count     { font-weight: 700; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .aq-src       { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 2px 6px; font-size: .68rem; padding-left: 10px; }
    .aq-tag       { border-radius: 3px; padding: 0 5px; cursor: default; border: 1px solid; }
    .aq-tag-have  { color: #52c46a; border-color: #1f4a2a; }
    .aq-tag-house { color: #5bc8e8; border-color: #1f3f4a; }
    .aq-tag-buy   { color: #f0a500; border-color: #4a3a1a; }
    .aq-tag-trade { color: #b47cff; border-color: #3a2a5a; }
    .aq-tag-short { color: #e05050; border-color: #4a1f1f; }
    .aq-tag-craft { color: #8888aa; border-color: #2a2a5a; }
    .aq-tag-craft-ok { color: #52c46a; border-color: #1f4a2a; }
    .aq-card.aq-craft   { border-left-color: #6ab0ff; }
    .aq-craft .aq-verdict   { color: #6ab0ff; }
    .aq-recipe    { grid-column: 1 / -1; margin: 3px 0 2px 10px; padding: 2px 0 2px 8px; border-left: 1px solid #2a2a5a; font-size: .68rem; }
    .aq-recipe-head { color: #8888aa; margin-bottom: 1px; }
    .aq-ing       { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 8px; padding: 1px 0; }
    .aq-ing .aq-src { padding-left: 8px; }
    .aq-keep      { color: #444466; font-size: .62rem; }
    .aq-rewards   { color: #666688; font-size: .66rem; margin-top: 5px; }
    .aq-rewards b { color: #b47cff; font-weight: 400; }
    .exp-label   { color: #666688; font-size: .75rem; margin-right: 4px; }
    .exp-chip    { background: #0f0f28; border: 1px solid #2a2a5a; border-radius: 12px; padding: 3px 10px; font-size: .75rem; display: inline-flex; gap: 6px; }
    .exp-skill   { color: #b47cff; }
    .credit-chip { font: inherit; font-size: .75rem; color: inherit; cursor: pointer; }
    .credit-chip:hover  { border-color: #b47cff; }
    .credit-chip.active { border-color: #b47cff; background: #2a1a4a; }
    .exp-amt     { color: #5bc8e8; font-weight: 700; }
    table {
      border-collapse: collapse;
      width: 100%;
      font-size: .77rem;
      min-width: 920px;
    }
    thead th {
      background: #0d0d1e;
      color: #f0a500;
      padding: 7px 10px;
      text-align: left;
      position: sticky; top: 0; z-index: 2;
      white-space: nowrap;
      border-bottom: 2px solid #2a2a5a;
      font-size: .68rem;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    th.sortable { cursor: pointer; user-select: none; }
    th.sortable:hover { background: #14142e; color: #ffc030; }
    td { padding: 6px 10px; vertical-align: top; border-bottom: 1px solid #111128; }
    tr.task-row:hover td { background: #0e0e20; }
    tr.task-row { border-bottom: 2px solid #1a1a38; }

    /* cell styles */
    .c-traveler  { font-weight: 800; color: #f0a500; white-space: nowrap; letter-spacing: .06em; }
    .traveler-sub { color: #666688; font-size: .65rem; font-weight: 400; letter-spacing: 0; margin-top: 2px; }
    .c-items     { color: #c8c8dc; line-height: 1.7; }
    .c-inv       { max-width: 120px; line-height: 1.7; }
    .c-sources   { line-height: 1.6; min-width: 300px; }
    .src-line    { white-space: nowrap; }
    .src-tag     { display: inline-block; min-width: 46px; padding: 0 5px; margin-right: 3px; border-radius: 3px;
                   font-size: .6rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
                   text-align: center; border: 1px solid; }
    .src-stall   { color: #b47cff; border-color: #3a2060; }
    .src-market  { color: #5bc8e8; border-color: #1f4a5a; }
    .src-barter  { color: #c8902a; border-color: #4a3a1a; }
    .src-house   { color: #5bc8e8; border-color: #1f3a4a; }
    .src-craft   { color: #52c46a; border-color: #1f4a28; }
    .src-have    { color: #52c46a; font-weight: 700; }
    .src-none    { color: #a05050; }
    .src-more summary { cursor: pointer; color: #666688; font-size: .67rem; }
    .src-more summary:hover { color: #c8c8dc; }
    .task-status { display: inline-block; margin-top: 4px; padding: 1px 7px; border-radius: 999px; font-size: .6rem;
                   font-weight: 700; letter-spacing: .04em; border: 1px solid; cursor: default; }
    .status-ready   { color: #52c46a; border-color: #1f4a28; background: #0a1f0a; }
    .status-buyable { color: #d6a23a; border-color: #4a3a1a; }
    .status-missing { color: #a05050; border-color: #4a1f1f; }
    tr.task-first td { border-top: 2px solid #1a1a38; }
    tr.status-row-ready td.c-traveler { box-shadow: inset 3px 0 0 #52c46a; }
    .c-num       { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }

    .qty         { color: #5bc8e8; font-weight: 700; }
    .sub         { color: #444466; font-size: .67rem; }
    .inv-ok      { color: #52c46a; font-size: .72rem; font-weight: 700; }
    .inv-part    { color: #f0a500; font-size: .72rem; font-weight: 700; }
    .craft-ok    { color: #52c46a; font-weight: 700; }
    .craft-no    { color: #333355; font-size: .7rem; }
    .stall-name  { color: #b47cff; font-size: .7rem; }
    .market-name { color: #5bc8e8; font-size: .7rem; font-weight: 700; }
    .market-price{ color: #f0a500; font-weight: 700; }
    .na          { color: #2a2a4a; font-style: italic; font-size: .68rem; }
    .dim         { color: #333355; font-size: .7rem; }
    .profit-pos     { color: #52c46a; font-weight: 800; }
    .profit-neg     { color: #e05050; font-weight: 800; }
    .profit-neutral { color: #666688; }
    .type-tag    { color: #444466; font-size: .62rem; background: #0d0d1e; border: 1px solid #1a1a3a; padding: 0 4px; border-radius: 3px; }

    #empty-msg { padding: 40px 20px; color: #333355; font-size: .9rem; }

    /* ── Custom tooltip ── */
    #tip-box {
      position: fixed;
      background: #0d0d1e;
      border: 1px solid #3a3a5a;
      color: #ccc;
      font-size: .72rem;
      padding: 6px 10px;
      border-radius: 5px;
      pointer-events: none;
      display: none;
      white-space: pre;
      z-index: 100;
      font-family: inherit;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div id="topbar">
    <div id="logo">⬡ Traveler Tasks <span>— BitCraft Assistant</span>
      <div id="logo-desc">A tool to assist with completing your Traveler Tasks in BitCraft</div>
    </div>
    <div id="search-row">
      <input id="username-input" type="text" placeholder="Enter player name…" list="stall-owners-list" autocomplete="off">
      <button id="btn-search">Search</button>
    </div>
    <span id="app-version"></span>
  </div>

  <div id="player-strip">
    <div>
      <div id="ps-name"></div>
      <div id="ps-detail"></div>
    </div>
    <div id="ps-market">
      <span>⊙ Market:</span>
      <input id="claim-input" type="text" placeholder="Select claim…" list="claim-list" autocomplete="off">
      <datalist id="claim-list"></datalist>
    </div>
    <div id="reset-cd" title="Estimated: 7 days after the last weekly credit reset"></div>
    <div id="range-group">
      <span>Market range:</span>
      <input type="range" id="market-range" min="0" max="1000" value="0" step="10">
      <span id="range-val">0h</span>
    </div>
  </div>

  <div id="housing-row">
    <div id="housing-label">
      <div style="font-weight:700;color:#5bc8e8;white-space:nowrap">Player Housing</div>
      <div style="color:#333355;font-size:.65rem;margin-top:1px">Add player housing as item sources for completing tasks</div>
    </div>
    <input id="housing-input" type="text" placeholder="Type a player name…" list="stall-owners-list" autocomplete="off">
    <button id="btn-housing-add">+ Add</button>
    <div id="housing-chips"></div>
  </div>

  <datalist id="stall-owners-list"></datalist>
  <div id="tip-box"></div>

  <div id="tabs" role="tablist">
    <button type="button" class="tab-btn active" role="tab" data-tab="tasks">Tasks<span class="tab-count" id="tab-count-tasks"></span></button>
    <button type="button" class="tab-btn" role="tab" data-tab="quests">Quests<span class="tab-count" id="tab-count-quests"></span></button>
  </div>

  <div id="toolbar">
    <button id="btn-refresh">↺ Refresh</button>
    <button id="btn-filter" class="tasks-only">☑ Completable only</button>
    <button id="btn-csv" class="tasks-only">↓ CSV</button>
    <span id="live-status"></span>
    <span id="status"></span>
  </div>

  <div id="api-warnings"></div>
  <div id="tab-tasks" class="tab-pane" role="tabpanel">
    <div id="credits-section"></div>

    <div id="tbl-wrap">
      <div id="empty-msg"></div>
      <table id="main-tbl" style="display:none">
        <thead id="tbl-head"></thead>
        <tbody id="tbl-body"></tbody>
      </table>
    </div>

    <div id="stock-section"></div>
    <div id="recommend-section"></div>
    <div id="exp-section"></div>
  </div>

  <div id="tab-quests" class="tab-pane" role="tabpanel" hidden>
    <div id="active-quests-section"></div>
    <div id="quests-section"></div>
  </div>

  <script src="app.js"></script>
  <footer style="text-align:center;padding:2rem 0 1rem;color:#444;font-size:.75rem;letter-spacing:.05em;">
    ✦ vibe-coded by <span style="color:#f0a500">Billard</span> &amp; <span style="color:#7b5ea7">Claude</span> ✦
  </footer>
</body>
</html>
